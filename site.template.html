<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Will Decker is a Psychology PhD student at Georgia Tech studying how intelligent systems learn, organize, and use knowledge.">
    <meta name="theme-color" content="#ffffff">
    <title>Will Decker</title>
    <style>
        :root {
            --ink: #11110f;
            --muted: #6b6b64;
            --paper: #ffffff;
            --line: #deded9;
            --white: #fff;
            --orange: #ff6719;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        a:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 4px;
        }

        .page {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
        }

        .topbar {
            display: grid;
            grid-template-columns: auto auto;
            gap: clamp(20px, 4vw, 56px);
            align-items: center;
            justify-content: space-between;
            min-height: 88px;
            border-bottom: 1px solid var(--line);
        }

        .wordmark {
            font-size: .82rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-decoration: none;
            text-transform: uppercase;
        }

        .topbar-links {
            display: flex;
            gap: 24px;
            align-items: center;
            justify-content: flex-end;
        }

        .topbar-links a {
            color: var(--muted);
            font-size: .82rem;
            text-decoration: none;
            transition: color 160ms ease;
        }

        .topbar-links a:hover { color: var(--ink); }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(300px, .75fr);
            gap: clamp(48px, 8vw, 108px);
            align-items: center;
            min-height: calc(100svh - 88px);
            padding: clamp(54px, 7vw, 96px) 0;
        }

        h1 {
            max-width: 7ch;
            margin: 0;
            font-size: clamp(4rem, 9vw, 7.7rem);
            font-weight: 400;
            letter-spacing: -.075em;
            line-height: .86;
        }

        .lede {
            max-width: 600px;
            margin: clamp(28px, 4vw, 46px) 0 0;
            font-size: clamp(1.08rem, 1.8vw, 1.38rem);
            font-weight: 400;
            letter-spacing: -.025em;
            line-height: 1.35;
        }

        .lede a {
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        .markdown-content > :first-child { margin-top: 0; }
        .markdown-content > :last-child { margin-bottom: 0; }
        .markdown-content a { text-underline-offset: 3px; }
        .markdown-content ul,
        .markdown-content ol { padding-left: 1.25em; }

        .portrait-wrap { position: relative; }

        .portrait {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            object-position: 42% center;
            filter: saturate(.86) contrast(.98);
        }

        .portrait-caption {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 12px;
            color: var(--muted);
            font-size: .72rem;
            letter-spacing: .04em;
        }

        .content-section {
            display: grid;
            grid-template-columns: .65fr 1.35fr;
            gap: clamp(42px, 7vw, 92px);
            padding: clamp(60px, 8vw, 104px) 0;
            border-top: 1px solid var(--line);
        }

        .research-section {
            display: block;
        }

        .research-summary {
            display: grid;
            grid-template-columns: .65fr 1.35fr;
            gap: clamp(42px, 7vw, 92px);
            align-items: start;
            list-style: none;
            cursor: pointer;
        }

        .research-summary::-webkit-details-marker { display: none; }

        .summary-mark {
            justify-self: end;
            color: var(--muted);
            font-size: 2.1rem;
            font-weight: 200;
            line-height: .9;
        }

        .research-section[open] .summary-mark::before { content: "−"; }
        .research-section:not([open]) .summary-mark::before { content: "+"; }

        .research-expanded {
            display: grid;
            grid-template-columns: .65fr 1.35fr;
            gap: clamp(42px, 7vw, 92px);
            margin-top: 36px;
        }

        .research-copy-wrap {
            grid-column: 2;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--line);
        }

        .research-copy {
            max-width: 670px;
            margin: 0;
            padding: 24px 48px 28px 0;
            color: var(--muted);
            font-size: clamp(1rem, 1.5vw, 1.16rem);
            line-height: 1.55;
        }

        .papers-list {
            margin: 0;
            padding: 0;
            border-top: 1px solid var(--ink);
            list-style: none;
        }

        .paper {
            display: grid;
            grid-template-columns: 62px 1fr auto;
            gap: 20px;
            padding: 22px 0;
            border-bottom: 1px solid var(--line);
        }

        .paper-year,
        .paper-authors {
            color: var(--muted);
            font-size: .78rem;
        }

        .paper-title {
            display: block;
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.35;
        }

        .paper-link {
            align-self: start;
            color: var(--muted);
            font-size: .8rem;
            text-decoration: none;
        }

        .paper-link:hover { color: var(--ink); }

        .mail-icon {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border: 1px solid var(--ink);
            border-radius: 50%;
            font-size: 1.1rem;
        }

        h2,
        .section-heading {
            display: block;
            margin: 0;
            font-size: clamp(2.3rem, 4.4vw, 4.05rem);
            font-weight: 400;
            letter-spacing: -.06em;
            line-height: .95;
        }

        .link-list { border-top: 1px solid var(--ink); }

        .destination {
            display: grid;
            grid-template-columns: 40px 1fr auto;
            gap: 18px;
            align-items: center;
            min-height: 74px;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            transition: padding 180ms ease, background 180ms ease;
        }

        .destination:hover {
            padding: 0 14px;
            background: #f7f7f5;
        }

        .destination img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .destination-name {
            font-size: 1rem;
            font-weight: 500;
        }

        .destination-meta,
        .arrow {
            color: var(--muted);
            font-size: .78rem;
        }

        .substack-dot {
            display: grid;
            width: 28px;
            height: 28px;
            place-items: center;
            border-radius: 50%;
            color: var(--white);
            background: var(--orange);
            font-size: .7rem;
            font-weight: 700;
        }

        @media (max-width: 760px) {
            .page { width: min(100% - 32px, 1180px); }
            .topbar {
                grid-template-columns: auto auto;
                gap: 18px;
            }
            .topbar-links { gap: 16px; }
            .hero {
                grid-template-columns: 1fr;
                min-height: auto;
                gap: 44px;
            }
            h1 { font-size: clamp(3.7rem, 21vw, 6.2rem); }
            .portrait-wrap {
                width: min(100%, 520px);
                margin-left: auto;
            }
            .portrait { aspect-ratio: 5 / 4; }
            .content-section { grid-template-columns: 1fr; }
            .research-summary,
            .research-expanded { grid-template-columns: 1fr; }
            .research-expanded { margin-top: 28px; }
            .research-copy-wrap { grid-column: 1; }
            .destination { grid-template-columns: 36px 1fr auto; }
            .destination-meta { display: none; }
            .paper { grid-template-columns: 50px 1fr auto; }
        }

        @media (max-width: 460px) {
            .topbar { min-height: 68px; }
            .topbar-links { gap: 12px; }
            .topbar-links a { font-size: .72rem; }
            .hero { padding-top: 52px; }
            .paper {
                grid-template-columns: 1fr auto;
                gap: 10px 16px;
            }
            .paper-year { grid-column: 1 / -1; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="wordmark" href="#top">Will Decker</a>
            <nav class="topbar-links" aria-label="Primary navigation">
                <a href="#connect">Find me</a>
                <a href="imgs/CV_10_18_26.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open CV in a new tab">CV ↗</a>
            </nav>
        </header>

        <main id="top">
            <section class="hero" aria-labelledby="page-title">
                <div>
                    <h1 id="page-title">Will Decker</h1>
                    <div class="lede markdown-content">{{BIO_HTML}}</div>
                </div>

                <figure class="portrait-wrap">
                    <img class="portrait" src="imgs/profile.JPG" alt="Will Decker outdoors beneath a blue sky">
                    <figcaption class="portrait-caption">
                        <span>Atlanta, Georgia</span>
                    </figcaption>
                </figure>
            </section>

            <details class="content-section research-section" id="research">
                <summary class="research-summary">
                    <span class="section-heading" id="research-title">Research<br>interests</span>
                    <span class="summary-mark" aria-hidden="true"></span>
                </summary>
                <div class="research-expanded">
                    <div class="research-copy-wrap">
                        <div class="research-copy markdown-content">{{RESEARCH_HTML}}</div>
                    </div>
                </div>
            </details>

            <section class="content-section" id="papers" aria-labelledby="papers-title">
                <div>
                    <h2 id="papers-title">Papers</h2>
                </div>

                <ol class="papers-list">{{PAPERS_HTML}}</ol>
            </section>

            <section class="content-section" id="connect" aria-labelledby="connect-title">
                <div>
                    <h2 id="connect-title">Find me<br>online</h2>
                </div>

                <div class="link-list">{{FIND_ME_HTML}}</div>
            </section>
        </main>
    </div>
</body>
</html>
